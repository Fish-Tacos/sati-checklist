<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoneyPotSquatch — SATI Expedition Manifest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --bg2: #111318;
    --bg3: #181c22;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --green: #00e87a;
    --green-dim: rgba(0,232,122,0.12);
    --green-mid: rgba(0,232,122,0.25);
    --amber: #f5a623;
    --amber-dim: rgba(245,166,35,0.12);
    --red: #ff4757;
    --red-dim: rgba(255,71,87,0.12);
    --text: #e8eaed;
    --text2: #8a9099;
    --text3: #555d6b;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }
  body { min-height: 100vh; }

  /* HEADER */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 20px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }
  .header-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
  }
  .header-title {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--green);
    text-transform: uppercase;
  }
  .header-sub {
    font-size: 11px;
    color: var(--text3);
    font-family: var(--mono);
    margin-left: 4px;
  }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .sync-status {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
  }
  .sync-btn {
    font-family: var(--mono);
    font-size: 11px;
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text2);
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .sync-btn:hover { border-color: var(--green); color: var(--green); }

  /* STATS */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    background: var(--bg);
    padding: 18px 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
  }
  .stat-val {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
  }
  .stat-val.green { color: var(--green); }
  .stat-val.amber { color: var(--amber); }

  /* MASTER PROGRESS */
  .master-progress {
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .master-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .pbar-track {
    flex: 1;
    height: 3px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
  }
  .pbar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.5s ease;
    box-shadow: 0 0 6px var(--green);
  }
  .master-pct {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--green);
    min-width: 36px;
    text-align: right;
  }

  /* CONTENT */
  .content { max-width: 820px; margin: 0 auto; padding: 24px 28px 60px; }

  /* SEGMENT */
  .segment { margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    cursor: pointer;
    background: var(--bg2);
    transition: background 0.15s;
    user-select: none;
  }
  .seg-header:hover { background: var(--bg3); }
  .seg-num {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.08em;
    min-width: 24px;
  }
  .seg-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
  }
  .seg-progress-inline {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .seg-pbar-track {
    width: 80px;
    height: 2px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
  }
  .seg-pbar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.4s;
  }
  .seg-count {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    min-width: 40px;
    text-align: right;
  }
  .seg-chevron {
    font-size: 11px;
    color: var(--text3);
    transition: transform 0.2s;
    font-family: var(--mono);
  }
  .seg-chevron.open { transform: rotate(180deg); }

  .seg-body { display: none; background: var(--bg); }
  .seg-body.open { display: block; }

  /* TASK ROW */
  .task-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 18px;
    border-top: 1px solid var(--border);
    transition: background 0.1s;
  }
  .task-row:hover { background: var(--bg2); }
  .task-row.done { opacity: 0.45; }

  .task-check {
    appearance: none;
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    border: 1px solid var(--border2);
    border-radius: 3px;
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
    position: relative;
    transition: all 0.15s;
  }
  .task-check:checked {
    background: var(--green);
    border-color: var(--green);
  }
  .task-check:checked::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 1px;
    width: 5px;
    height: 8px;
    border: 2px solid #0a0c0f;
    border-top: none;
    border-left: none;
    transform: rotate(45deg);
  }
  .task-check:hover:not(:checked) { border-color: var(--green); }

  .gate-badge {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 3px;
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid rgba(255,71,87,0.2);
    flex-shrink: 0;
    margin-top: 2px;
  }
  .gate-badge.cleared {
    background: var(--green-dim);
    color: var(--green);
    border-color: rgba(0,232,122,0.2);
  }

  .task-text {
    font-size: 13px;
    color: var(--text);
    line-height: 1.55;
    flex: 1;
  }
  .task-row.done .task-text {
    text-decoration: line-through;
    color: var(--text3);
  }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 60px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text3);
    letter-spacing: 0.1em;
  }
  .loading span { color: var(--green); animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* MOBILE */
  @media (max-width: 600px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .header { padding: 14px 16px; }
    .content { padding: 16px 12px 40px; }
    .seg-pbar-track { display: none; }
    .header-sub { display: none; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-dot"></div>
  <div>
    <div class="header-title">HoneyPotSquatch</div>
    <span class="header-sub">SATI v6.6 — expedition manifest</span>
  </div>
  <div class="header-right">
    <span class="sync-status" id="sync-status">—</span>
    <button class="sync-btn" onclick="loadData()">↻ sync</button>
  </div>
</header>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-label">Total tasks</div>
    <div class="stat-val" id="st-total">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Completed</div>
    <div class="stat-val green" id="st-done">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Gates open</div>
    <div class="stat-val amber" id="st-gates">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Progress</div>
    <div class="stat-val green" id="st-pct">—</div>
  </div>
</div>

<div class="master-progress">
  <span class="master-label">expedition progress</span>
  <div class="pbar-track"><div class="pbar-fill" id="master-fill" style="width:0%"></div></div>
  <span class="master-pct" id="master-pct-label">0%</span>
</div>

<main class="content">
  <div id="loading" class="loading">initializing telemetry<span>_</span></div>
  <div id="segments"></div>
</main>

<script>
const SUPABASE_URL = 'https://mmgqntcwncanpjajpbrc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_60jU2eDrd6rTrCz1HXZkxA_F-J8RE3q';

let tasks = [];
let openSegs = { 1: true, 2: false, 3: false, 4: false, 5: false };

const SEG_LABELS = {
  1: 'Infrastructure build',
  2: 'Science & credibility',
  3: 'Run one — silent expedition',
  4: 'Run two — the documentary',
  5: 'Revenue & publication'
};

async function loadData() {
  document.getElementById('sync-status').textContent = 'syncing…';
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/sati_checklist?select=*&order=task_id`,
      { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } }
    );
    tasks = await res.json();
    render();
    const t = new Date();
    document.getElementById('sync-status').textContent =
      'synced ' + t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    document.getElementById('sync-status').textContent = 'sync failed';
  }
}

async function toggle(taskId, checked) {
  const task = tasks.find(t => t.task_id === taskId);
  if (task) task.checked = checked;
  render();
  try {
    await fetch(
      `${SUPABASE_URL}/rest/v1/sati_checklist?task_id=eq.${taskId}`,
      {
        method: 'PATCH',
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json',
          Prefer: 'return=minimal'
        },
        body: JSON.stringify({ checked, updated_at: new Date().toISOString() })
      }
    );
  } catch (e) {
    if (task) task.checked = !checked;
    render();
  }
}

function render() {
  document.getElementById('loading').style.display = 'none';

  const total = tasks.length;
  const done = tasks.filter(t => t.checked).length;
  const gatesOpen = tasks.filter(t => t.is_blocking && !t.checked).length;
  const pct = total ? Math.round(done / total * 100) : 0;

  document.getElementById('st-total').textContent = total;
  document.getElementById('st-done').textContent = done;
  document.getElementById('st-gates').textContent = gatesOpen;
  document.getElementById('st-pct').textContent = pct + '%';
  document.getElementById('master-fill').style.width = pct + '%';
  document.getElementById('master-pct-label').textContent = pct + '%';

  const segs = [1, 2, 3, 4, 5];
  const container = document.getElementById('segments');
  container.innerHTML = '';

  segs.forEach(seg => {
    const segTasks = tasks.filter(t => t.segment === seg);
    if (!segTasks.length) return;

    const segDone = segTasks.filter(t => t.checked).length;
    const segTotal = segTasks.length;
    const segPct = Math.round(segDone / segTotal * 100);
    const isOpen = openSegs[seg];

    const div = document.createElement('div');
    div.className = 'segment';
    div.innerHTML = `
      <div class="seg-header" onclick="toggleSeg(${seg})">
        <span class="seg-num">S${seg}</span>
        <span class="seg-name">${SEG_LABELS[seg]}</span>
        <div class="seg-progress-inline">
          <div class="seg-pbar-track"><div class="seg-pbar-fill" style="width:${segPct}%"></div></div>
          <span class="seg-count">${segDone}/${segTotal}</span>
        </div>
        <span class="seg-chevron ${isOpen ? 'open' : ''}">▼</span>
      </div>
      <div class="seg-body ${isOpen ? 'open' : ''}" id="seg-body-${seg}">
        ${segTasks.map(t => `
          <div class="task-row ${t.checked ? 'done' : ''}">
            <input
              type="checkbox"
              class="task-check"
              ${t.checked ? 'checked' : ''}
              onchange="toggle('${t.task_id}', this.checked)"
              aria-label="${t.task_text}"
            >
            ${t.is_blocking
              ? `<span class="gate-badge ${t.checked ? 'cleared' : ''}">gate</span>`
              : ''}
            <span class="task-text">${t.task_text}</span>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(div);
  });
}

function toggleSeg(seg) {
  openSegs[seg] = !openSegs[seg];
  render();
}

loadData();
</script>
</body>
</html>
